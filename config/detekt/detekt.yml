# detekt configuration, layered over detekt's defaults (buildUponDefaultConfig).
# Only deviations from the defaults live here. Rule docs: https://detekt.dev/docs/rules/
# Compose rules: https://mrmans0n.github.io/compose-rules/rules/
# ktlint formatting rules read their style from .editorconfig.

config:
  validation: true
  warningsAsErrors: true

comments:
  OutdatedDocumentation:
    active: true
  DeprecatedBlockTag:
    active: true

complexity:
  CognitiveComplexMethod:
    active: true
  NestedScopeFunctions:
    active: true
  # Composables are layout trees; length and parameter count follow the UI, not complexity.
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Test source sets, including per-flavor ones (testFoss, testPlay) that detekt's defaults miss.
    excludes: &testSources ['**/test/**', '**/test*/**', '**/androidTest/**', '**/androidTest*/**']
    ignorePrivate: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  SuspendFunInFinallySection:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
  CoroutineLaunchedInTestWithoutRunTest:
    active: true

exceptions:
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true

naming:
  FunctionNaming:
    excludes: *testSources
    ignoreAnnotated: ['Composable']
  BooleanPropertyNaming:
    active: false
  NonBooleanPropertyPrefixedWithIs:
    active: true

performance:
  UnnecessaryPartOfBinaryExpression:
    active: true
  UnnecessaryTypeCasting:
    active: true

potential-bugs:
  CastNullableToNonNullableType:
    active: true
  CharArrayToStringCall:
    active: true
  Deprecation:
    active: true
  DontDowncastCollectionTypes:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  ExitOutsideMain:
    active: true
  ImplicitUnitReturnType:
    active: true
  MissingSuperCall:
    active: true
  MissingUseCall:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  PropertyUsedBeforeDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullCheck:
    active: true

style:
  AlsoCouldBeApply:
    active: true
  CanBeNonNullable:
    active: true
  CollapsibleIfStatements:
    active: true
  DataClassShouldBeImmutable:
    active: true
  DoubleNegativeExpression:
    active: true
  DoubleNegativeLambda:
    active: true
  ExplicitCollectionElementAccessMethod:
    active: true
  ForbiddenMethodCall:
    active: true
  # dp/sp values and colors are self-describing in UI code.
  MagicNumber:
    excludes: ['**/test/**', '**/test*/**', '**/androidTest/**', '**/androidTest*/**', '**/*.kts']
    ignoreAnnotated: ['Composable', 'Preview']
  MultilineLambdaItParameter:
    active: true
  NullableBooleanCheck:
    active: true
  RangeUntilInsteadOfRangeTo:
    active: true
  RedundantExplicitType:
    active: true
  UnnecessaryBackticks:
    active: true
  UnnecessaryFullyQualifiedName:
    active: true
  UnnecessaryInnerClass:
    active: true
  UnnecessaryLet:
    active: true
  UnusedImport:
    active: true
  UseDataClass:
    active: true
  UseEmptyCounterpart:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  UseSumOfInsteadOfFlatMapSize:
    active: true

# ktlint formatting rules (`./gradlew detekt --auto-correct` applies the fixes).
ktlint:
  code_style: 'android_studio'
  # Same check as detekt's style>MaxLineLength (120), which already runs.
  MaximumLineLength:
    active: false
  # android_studio defaults every wrapping rule to 100 columns; keep them all at the
  # project's 120 or --auto-correct flip-flops between rules on long lambda headers.
  ArgumentListWrapping:
    maxLineLength: 120
  BinaryExpressionWrapping:
    maxLineLength: 120
  ChainMethodContinuation:
    maxLineLength: 120
  ClassSignature:
    maxLineLength: 120
  ContextReceiverListWrapping:
    maxLineLength: 120
  ContextReceiverMapping:
    maxLineLength: 120
  FunctionExpressionBody:
    maxLineLength: 120
  FunctionLiteral:
    maxLineLength: 120
  FunctionReturnTypeSpacing:
    maxLineLength: 120
  FunctionSignature:
    maxLineLength: 120
  ParameterListSpacing:
    maxLineLength: 120
  ParameterListWrapping:
    maxLineLength: 120
  ParameterWrapping:
    maxLineLength: 120
  PropertyWrapping:
    maxLineLength: 120
  Wrapping:
    maxLineLength: 120
  FunctionNaming:
    ignoreWhenAnnotatedWith: ['Composable']

Compose:
  ComposableNestingDepth:
    active: true
  Material2:
    active: true
  PreviewNaming:
    active: true
