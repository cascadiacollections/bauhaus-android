name: Nightly APK

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Install Android SDK platform
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"'
      - name: Restore persistent nightly signing key
        env:
          NIGHTLY_KEYSTORE: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NIGHTLY_KEYSTORE" || { echo '::error::NIGHTLY_KEYSTORE_BASE64 is required'; exit 1; }
          printf '%s' "$NIGHTLY_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/nightly.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nightly.jks" >> "$GITHUB_ENV"
      - name: Build signed FOSS APK and run unit tests
        run: ./gradlew :app:assembleFossRelease :app:testFossDebugUnitTest --no-daemon --build-cache
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: androiddebugkey
          KEY_PASSWORD: android
      - name: Verify signature and prepare download
        run: |
          set -euo pipefail
          mkdir dist
          cp app/build/outputs/apk/foss/release/app-foss-release.apk dist/bauhaus-android-nightly.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose dist/bauhaus-android-nightly.apk
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-apk
          path: dist
      - name: Publish nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-build" -f sha="$GITHUB_SHA" -F force=true ||             gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/nightly-build -f sha="$GITHUB_SHA"
          notes="Latest main ($GITHUB_SHA). Signed FOSS APK for sideloading. Uses a persistent nightly key; updating an existing store or locally signed installation may require uninstalling it first."
          if gh release view nightly-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly-build --repo "$GITHUB_REPOSITORY" --title 'Nightly Build' --notes "$notes" --prerelease --latest=false
          else
            gh release create nightly-build --repo "$GITHUB_REPOSITORY" --title 'Nightly Build' --notes "$notes" --prerelease --latest=false --verify-tag
          fi
          gh release upload nightly-build dist/* --repo "$GITHUB_REPOSITORY" --clobber
